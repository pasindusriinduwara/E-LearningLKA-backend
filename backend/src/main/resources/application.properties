spring.application.name=tuition-lms-backend
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION_MS:86400000}
application.security.auth-rate-limit.login-ip-limit=${AUTH_LOGIN_IP_LIMIT:100}
application.security.auth-rate-limit.login-account-limit=${AUTH_LOGIN_ACCOUNT_LIMIT:10}
application.security.auth-rate-limit.login-window-seconds=${AUTH_LOGIN_WINDOW_SECONDS:60}
application.security.auth-rate-limit.login-account-window-seconds=${AUTH_LOGIN_ACCOUNT_WINDOW_SECONDS:900}
application.security.auth-rate-limit.register-ip-limit=${AUTH_REGISTER_IP_LIMIT:10}
application.security.auth-rate-limit.register-account-limit=${AUTH_REGISTER_ACCOUNT_LIMIT:3}
application.security.auth-rate-limit.register-window-seconds=${AUTH_REGISTER_WINDOW_SECONDS:600}
application.security.auth-rate-limit.max-entries=${AUTH_RATE_LIMIT_MAX_ENTRIES:10000}
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
server.port=${PORT:8080}
# Authentication rate limiting uses the direct peer address; do not accept client-supplied forwarding headers.
server.forward-headers-strategy=none

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tuition_lms}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Colombo

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

management.endpoints.web.exposure.include=health,info

spring.config.import=optional:file:.env
